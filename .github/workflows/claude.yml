name: Claude Code

# Responds to @claude mentions in issues, PR comments and reviews.
# Mirrors everstrat-xyz/contracts.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # so Claude can read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Unlike the review workflow, a missing token here is only reachable when
      # somebody actively typed @claude — so it answers on the thread rather
      # than leaving them waiting on a mention that silently did nothing.
      - name: Check for the Claude token
        id: creds
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Claude mention ignored::CLAUDE_CODE_OAUTH_TOKEN is not set on this repository."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain the missing token
        if: steps.creds.outputs.run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          [ -n "${TARGET}" ] || exit 0
          gh api "repos/${{ github.repository }}/issues/${TARGET}/comments" \
            -f body=":warning: \`@claude\` is not configured on this repository — \`CLAUDE_CODE_OAUTH_TOKEN\` is unset, so this mention did nothing. Add it with \`claude setup-token\` and \`gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo ${{ github.repository }}\`." \
            >/dev/null

      - name: Run Claude Code
        if: steps.creds.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
