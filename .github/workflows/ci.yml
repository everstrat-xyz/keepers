name: ci

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # W1/W2 — Mimic functions. `npm test` compiles the function to WASM and runs
  # the specs against that artifact, so the thing under test is the thing that
  # ships.
  functions:
    name: mimic-functions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function: [queue-keeper, strategy-keeper]
    defaults:
      run:
        working-directory: mimic-functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mimic-functions/${{ matrix.function }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
