# Logical secret names mapped to environment variables for local simulation.
# Deployed workflows use Vault DON via `cre secrets` (same names).
# Docs: https://docs.chain.link/cre/guides/workflow/secrets
#
# Contract addresses are NOT secrets — they are public config and live in
# config.<target>.json. Only capabilities belong here.
secretsNames:
  # W4 alert destination. A secret because anyone holding the URL can post to
  # the ops channel; W4 runs with dryRun until it is populated.
  ALERT_WEBHOOK_URL:
    - ALERT_WEBHOOK_URL
