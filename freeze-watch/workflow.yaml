# W4 — freeze-watch (observability only; no on-chain writes)

local-settings:
  user-workflow:
    workflow-name: "everstrat-freeze-watch-local"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "."
    config-path: "./config.local.json"
    secrets-path: ""

staging-settings:
  user-workflow:
    workflow-name: "everstrat-freeze-watch-staging"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "."
    config-path: "./config.staging.json"
    secrets-path: ""

production-settings:
  user-workflow:
    workflow-name: "everstrat-freeze-watch-production"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "."
    config-path: "./config.production.json"
    secrets-path: ""
