version: 1.0.0
name: EverStrat Queue Keeper
description: >
  W1 deep-scan keeper for the EverStrat redemption queue. Walks priced
  batches beyond the on-chain MAX_BATCH_SCAN window and emits a
  perform(action, params) EvmCall intent when work exists.
inputs:
  - chainId: uint32
  - registry: address
  - executor: address
  - controller: address
  - exitQueue: address
  - smartAccount: address
  - maxBatches: uint32
  - maxRequestsPerBatch: uint32
  - maxFee: string
abis:
  - QueueKeeperExecutor: ./abis/QueueKeeperExecutor.json
  - IExitQueue: ./abis/IExitQueue.json
  - IController: ./abis/IController.json
  - IRegistry: ./abis/IRegistry.json
  - Pausable: ./abis/Pausable.json
