# Global CRE project settings (RPC targets). Workflow names live in each workflow.yaml.
# Docs: https://docs.chain.link/cre/reference/project-configuration-go

# Local anvil fork of Sepolia with the protocol deployed. This is the only
# target that exercises the workflows' EVM reads end to end before the Sepolia
# cutover — see docs/LOCAL_FORK.md for the recipe.
local-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: http://127.0.0.1:8545

staging-settings:
  rpcs:
    # Public Sepolia RPC for local simulate; override with SEPOLIA_RPC_URL if preferred.
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com

production-settings:
  # Optional: set for multi-sig ownership of onchain-registry workflows.
  # account:
  #   workflow-owner-address: "0x..."
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: ${SEPOLIA_RPC_URL}
    - chain-name: ethereum-mainnet
      url: ${MAINNET_RPC_URL}
