# golangci-lint configuration (v2 schema).
#
# The linter set targets the failure modes this repo actually has: an unchecked
# error or a shadowed variable in a read path produces a keeper that decides
# against half-read state, and the contract then rejects the report. Style
# linters are left off — gofmt already runs in CI, and taste arguments in review
# are a poor use of anyone's time.
#
# Note the toolchain floor: golangci-lint refuses to run when it was built with
# an older Go than the module targets, so v2.x is required for this module's
# go 1.25.3.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck      # an ignored error in a read path means deciding on missing state
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint     # %w and errors.Is, which the guard errors depend on
    - gocritic
    - misspell
    - nilerr        # returning nil after a non-nil error: a silent wrong answer
    - unconvert
    - copyloopvar
    - durationcheck # seconds-to-Duration mistakes, which the report-age math invites

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      # `shadow` is deliberately off. Every hit in this repo is the ordinary
      # `x, err := f()` inside a block that already has an `err`, checked
      # immediately on the next line — the check cannot distinguish that from
      # the real bug (shadowing, then testing the stale outer `err`), and the
      # false-positive rate would push people toward blanket nolints.
      enable-all: false
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # Long if/else chains mirroring contract branch order are clearer than
        # switches here, because they read alongside the Solidity they mirror.
        - ifElseChain
        # State and Observation are deliberately passed by value: they are
        # immutable per-tick snapshots, and a pointer would invite a decision
        # function to mutate what it is deciding from. The copy costs
        # nanoseconds against a chain read that costs milliseconds.
        - hugeParam

  exclusions:
    rules:
      # Test fixtures deliberately construct odd states, and a shadowed `err`
      # in a table test is not the bug class this config is aimed at.
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - govet
